<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mumy - Acceso al Sistema</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    body { background-color: #f1f5f9; color: #0f172a; user-select: none; -webkit-user-select: none; }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 font-sans bg-slate-100">

  <div class="w-full max-w-md bg-white border border-slate-300 rounded-2xl shadow-sm p-8">
    
    <div id="headerTitleArea" class="border-b border-slate-200 pb-5 mb-6">
      <div class="text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">Sistema de Control Interno</div>
      <h1 class="text-2xl font-bold text-slate-900">Mumy - Panel de Control</h1>
      <p class="text-xs text-slate-600 mt-1">Ingrese la contraseña autorizada para iniciar sesión.</p>
    </div>

    <!-- Aviso de Mantenimiento Fiel a la Imagen -->
    <div id="maintenanceBanner" class="hidden transition-all duration-300 ease-in-out bg-white p-4 text-center space-y-4 mb-2">
      
      <!-- Ilustración Vectorial 3D (Laptop, Engranajes y Reloj) -->
      <div class="flex justify-center items-center py-2">
        <div class="relative w-32 h-32 flex justify-center items-center">
          <div class="absolute inset-0 bg-amber-100/60 rounded-full blur-xl"></div>
          
          <svg class="w-28 h-28 relative z-10 drop-shadow-md" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="25" y="65" width="70" height="40" rx="6" fill="#475569" />
            <rect x="29" y="69" width="62" height="32" rx="4" fill="#0F172A" />
            <path d="M15 105C15 102.239 17.2386 100 20 100H100C102.761 100 105 102.239 105 105V106H15V105Z" fill="#94A3B8" />
            
            <g transform="translate(38, 28)">
              <rect x="17" y="0" width="6" height="40" rx="2" fill="#F59E0B" />
              <rect x="0" y="17" width="40" height="6" rx="2" fill="#F59E0B" />
              <rect x="17" y="0" width="6" height="40" rx="2" fill="#F59E0B" transform="rotate(45 20 20)" />
              <rect x="0" y="17" width="40" height="6" rx="2" fill="#F59E0B" transform="rotate(45 20 20)" />
              <circle cx="20" cy="20" r="14" fill="#F59E0B" />
              <circle cx="20" cy="20" r="6" fill="#FEF3C7" />
            </g>
            
            <g transform="translate(62, 18)">
              <rect x="12" y="0" width="4" height="28" rx="1.5" fill="#FBBF24" />
              <rect x="0" y="12" width="28" height="4" rx="1.5" fill="#FBBF24" />
              <rect x="12" y="0" width="4" height="28" rx="1.5" fill="#FBBF24" transform="rotate(45 14 14)" />
              <rect x="0" y="12" width="28" height="4" rx="1.5" fill="#FBBF24" transform="rotate(45 14 14)" />
              <circle cx="14" cy="14" r="10" fill="#FBBF24" />
              <circle cx="14" cy="14" r="4" fill="#FFFBEB" />
            </g>
            
            <g transform="translate(70, 58)">
              <circle cx="14" cy="14" r="12" fill="#FFFFFF" stroke="#F59E0B" stroke-width="3" />
              <path d="M14 7V14L18 16" stroke="#D97706" stroke-width="2.5" stroke-linecap="round" />
            </g>
          </svg>
        </div>
      </div>

      <div class="space-y-1">
        <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight">Aviso</h2>
        <p class="text-xl font-extrabold text-amber-500">Mantenimiento de sistemas</p>
        <p class="text-sm font-semibold text-slate-700 pt-1">Equipo Vetric Technology</p>
      </div>

      <div class="pt-4">
        <button onclick="hideMaintenance()" class="text-xs font-bold text-slate-500 hover:text-slate-900 uppercase tracking-wider underline">
          Reintentar contraseña
        </button>
      </div>
    </div>

    <!-- Formulario de Acceso -->
    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label for="username" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Usuario / Estación</label>
        <select id="username" class="w-full bg-slate-50 border border-slate-300 rounded px-3 py-2 text-sm text-slate-900 font-medium focus:outline-none focus:border-slate-800">
          <option value="Administrador">Administrador General</option>
          <option value="Caja 1">Caja 1 - Principal</option>
          <option value="Cocina / Despacho">Cocina / Despacho</option>
        </select>
      </div>

      <div>
        <label for="password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Contraseña de Acceso</label>
        <input type="password" id="password" autocomplete="off" required class="w-full bg-slate-50 border border-slate-300 rounded px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-slate-800" placeholder="Ingrese contraseña de acceso">
      </div>

      <div class="flex items-center justify-between text-xs pt-1">
        <label class="flex items-center gap-2 text-slate-700 font-medium cursor-pointer">
          <input type="checkbox" id="rememberMe" class="rounded border-slate-300">
          Recordar sesión en este navegador
        </label>
      </div>

      <button type="submit" class="w-full bg-slate-900 text-white font-bold text-xs uppercase tracking-wider py-3 rounded hover:bg-slate-800 transition-colors">
        Iniciar Sesión
      </button>
    </form>

    <div class="border-t border-slate-200 pt-4 mt-6 text-center">
      <p class="text-[11px] text-slate-500">Mumy Cafetería & Repostería · Control de Pedidos y Caja</p>
    </div>
  </div>

  <script>
    // BLOQUEO ANTI-INSPECCIÓN (Clic derecho, F12, Ctrl+U, Ctrl+Shift+I)
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key.toUpperCase())) || (e.ctrlKey && ['U','S'].includes(e.key.toUpperCase()))) {
        e.preventDefault();
      }
    });

    if (localStorage.getItem('mumy_logged_in') === 'true' || sessionStorage.getItem('mumy_logged_in') === 'true') {
      window.location.href = 'index.html';
    }

    // Token cifrado (evita almacenar la clave en texto plano)
    const _secToken = "==QTM0MjJjc3Rldl";

    function _verifyPass(input) {
      try {
        return btoa(input).split('').reverse().join('') === _secToken;
      } catch (err) {
        return false;
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const pwd = document.getElementById('password').value.trim();
      const user = document.getElementById('username').value;
      const remember = document.getElementById('rememberMe').checked;
      const banner = document.getElementById('maintenanceBanner');
      const form = document.getElementById('loginForm');

      if (_verifyPass(pwd)) {
        if (remember) {
          localStorage.setItem('mumy_logged_in', 'true');
          localStorage.setItem('mumy_user', user);
        } else {
          sessionStorage.setItem('mumy_logged_in', 'true');
          sessionStorage.setItem('mumy_user', user);
        }
        window.location.href = 'index.html';
      } else {
        form.classList.add('hidden');
        banner.classList.remove('hidden');
        document.getElementById('password').value = '';
      }
    }

    function hideMaintenance() {
      document.getElementById('maintenanceBanner').classList.add('hidden');
      document.getElementById('loginForm').classList.remove('hidden');
      document.getElementById('password').focus();
    }
  </script>
</body>
</html>
